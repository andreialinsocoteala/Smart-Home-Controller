<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Smart devices</title>
    <meta charset="UTF-8"/>
</head>
<body>
<h1>Smart devices</h1>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Status</th>
        <th>Level</th>
        <th colspan="3">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="device : ${devices}">
        <td th:text="${device.id}"></td>
        <td th:text="${device.name}"></td>
        <td th:text="${device.status}"></td>

        <td>
            <span th:if="${device.level == null}">–</span>

            <form th:if="${device.level != null}"
                  th:action="@{'/devices/' + ${device.id} + '/level'}"
                  method="post"
                  style="margin:0">

                <input type="number"
                       name="level"
                       min="0" max="100"
                       th:value="${device.level}"/>

                <button type="submit">Set</button>
            </form>
        </td>

        <td>
            <form th:action="@{'/devices/' + ${device.id} + '/on'}"
                  method="post" style="margin:0">
                <button type="submit">ON</button>
            </form>
        </td>

        <td>
            <form th:action="@{'/devices/' + ${device.id} + '/off'}"
                  method="post" style="margin:0">
                <button type="submit">OFF</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<p>
    <a href="/devices/logs">
        <button type="button">View Logs</button>
    </a>
</p>

</body>
</html>
