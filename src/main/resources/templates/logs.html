<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Device Logs</title>
    <meta charset="UTF-8"/>

    <style>
        :root {
            --bg: #f4f5f7;
            --card-bg: #ffffff;
            --border-soft: #d3d7e0;
            --border-strong: #a7afbf;
            --accent: #2563eb;
            --text-main: #111827;
            --text-soft: #6b7280;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, #e5edff 0, #f4f5f7 45%, #f9fafb 100%);
            color: var(--text-main);
        }

        h1 {
            margin: 0 0 20px;
            font-size: 30px;
            font-weight: 700;
        }

        a.back-link {
            display: inline-block;
            margin-bottom: 18px;
            text-decoration: none;
            font-size: 14px;
            color: var(--accent);
            font-weight: 600;
        }

        a.back-link:hover {
            text-decoration: underline;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-soft);
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.12);
            padding: 20px;
            max-width: 900px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            background: #f3f4f6;
        }

        th, td {
            padding: 10px 8px;
            text-align: left;
        }

        th {
            font-weight: 600;
            color: #4b5563;
            border-bottom: 1px solid var(--border-soft);
        }

        tbody tr:nth-child(odd) {
            background: #f9fafb;
        }

        tbody tr:hover {
            background: #eef2ff;
        }

        .action-tag {
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .action-on {
            background: var(--success);
            color: white;
        }

        .action-off {
            background: var(--danger);
            color: white;
        }

        .action-level {
            background: var(--warning);
            color: white;
        }

    </style>
</head>
<body>

<h1>Device Logs</h1>

<a href="/devices" class="back-link">← Back to devices</a>

<div class="card">
    <div class="card-title">Recent activity</div>

    <table>
        <thead>
        <tr>
            <th style="width: 200px;">Timestamp</th>
            <th style="width: 160px;">Device ID</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="log : ${logs}">
            <td th:text="${log.timestamp}"></td>
            <td th:text="${log.deviceId}"></td>

            <td>
                <span th:switch="${log.action}">
                    <span th:case="'ON'" class="action-tag action-on">ON</span>
                    <span th:case="'OFF'" class="action-tag action-off">OFF</span>
                    <span th:case="'LEVEL_CHANGED'" class="action-tag action-level">Level changed</span>

                    <span th:case="*"
                          class="action-tag"
                          style="background:#e5e7eb; color:#111827;"
                          th:text="${log.action}">
                    </span>
                </span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
